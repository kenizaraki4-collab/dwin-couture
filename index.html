<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dwin Couture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ivory:#F2EBDD;
    --card:#FBF8F1;
    --charcoal:#221E1A;
    --charcoal-soft:#3A342C;
    --gold:#A9823D;
    --gold-soft:#D9C9A3;
    --burgundy:#6E2A38;
    --muted:#7A7166;
    --line:#DCD1BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--charcoal);
    font-family:'Jost',sans-serif;
    font-weight:400;
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;}

  header{
    padding:36px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header img{
    width:150px;
    height:150px;
    object-fit:contain;
    display:block;
    margin:0 auto 6px;
  }
  header p.tagline{
    margin:0;
    font-size:15px;
    font-style:italic;
    color:var(--muted);
    font-family:'Cormorant Garamond',serif;
  }
  header p.contact-line{
    margin:4px 0 0;
    font-size:13px;
    color:var(--charcoal-soft);
    letter-spacing:0.01em;
  }

  .tabs{
    display:flex;
    justify-content:center;
    gap:0;
    margin:34px 0 28px;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    background:none;
    border:none;
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
    font-weight:600;
    color:var(--muted);
    padding:8px 26px 14px;
    cursor:pointer;
    position:relative;
    transition:color .25s ease;
  }
  .tab-btn.active{color:var(--charcoal);}
  .tab-btn.active::after{
    content:'';
    position:absolute;
    left:18%;right:18%;bottom:-1px;
    height:2px;
    background:var(--gold);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:18px;
    padding:0 0 60px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .card .imgbox{
    aspect-ratio:3/4;
    background:#EFE7D6;
    overflow:hidden;
  }
  .card .imgbox img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .card .info{
    padding:12px 14px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .card .info h3{
    margin:0;
    font-size:19px;
    font-weight:600;
  }
  .card .order-btn{
    margin-top:auto;
    background:var(--charcoal);
    color:var(--ivory);
    border:none;
    padding:10px 12px;
    font-family:'Jost',sans-serif;
    font-size:13px;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:background .2s ease;
  }
  .card .order-btn:hover{background:var(--burgundy);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'Cormorant Garamond',serif;
    font-size:19px;
    font-style:italic;
  }

  footer{
    text-align:center;
    padding:22px 20px 34px;
    color:var(--muted);
    font-size:12px;
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(34,30,26,0.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--ivory);
    border:1px solid var(--line);
    max-width:440px;
    width:100%;
    padding:28px 24px 30px;
    position:relative;
  }
  .modal h2{margin:0 0 4px;font-size:24px;}
  .modal .sub{font-size:13px;color:var(--muted);margin:0 0 20px;}
  .modal label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:14px 0 5px;
  }
  .modal input[type=text],
  .modal input[type=password],
  .modal select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Jost',sans-serif;
    font-size:14px;
  }
  .modal input[type=file]{
    width:100%;
    font-size:13px;
    margin-top:2px;
  }
  .modal .primary-btn{
    margin-top:20px;
    width:100%;
    background:var(--charcoal);
    color:var(--ivory);
    border:none;
    padding:11px;
    font-size:14px;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .modal .primary-btn:disabled{opacity:.5;cursor:default;}
  .modal .primary-btn:hover:not(:disabled){background:var(--burgundy);}
  .modal .close-x{
    position:absolute;top:14px;right:16px;
    background:none;border:none;font-size:20px;
    cursor:pointer;color:var(--muted);
    line-height:1;
  }
  .modal .error-msg{
    color:var(--burgundy);
    font-size:13px;
    margin-top:10px;
    display:none;
  }
  .radio-row{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .radio-row label{
    display:flex;align-items:center;gap:8px;
    font-size:14px;color:var(--charcoal);
    margin:0;
  }
  .divider{
    border:none;border-top:1px solid var(--line);
    margin:26px 0 18px;
  }
  .admin-list{
    display:flex;flex-direction:column;gap:8px;
    max-height:220px;overflow-y:auto;
    margin-top:10px;
  }
  .admin-list .row{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);
    padding:6px 8px;
    background:#fff;
    font-size:13px;
  }
  .admin-list .row img{
    width:36px;height:44px;object-fit:cover;
  }
  .admin-list .row .name{flex:1;}
  .admin-list .row .cat{color:var(--muted);font-size:11px;}
  .admin-list .row button{
    background:none;border:none;color:var(--burgundy);
    cursor:pointer;font-size:12px;
    text-decoration:underline;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;
    transform:translateX(-50%);
    background:var(--charcoal);color:var(--ivory);
    padding:10px 18px;font-size:13px;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    z-index:80;
  }
  .toast.show{opacity:1;}
  .admin-page-wrap{max-width:480px;margin:40px auto;padding:0 20px 60px;}
  .back-link{
    display:inline-block;margin-bottom:18px;font-size:13px;
    color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);
  }
</style>
</head>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" data-cat="hommes">Hommes</button>
    <button class="tab-btn" data-cat="femmes">Femmes</button>
    <button class="tab-btn" data-cat="enfants">Enfants</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">Aucun modèle pour le moment dans cette catégorie.</div>
</div>

<footer>Dwin Couture</footer>

<script>

const SUPABASE_URL = "https://fhpmshyylqflgxxxomgx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IP4RR3zcXFFGK08qFsjPlw_cNg_Iwfp";
const BUCKET_NAME = "produit-image";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


let currentCat = "hommes";
let products = [];
let activeNumber = "22899601819";

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.getAttribute('data-cat');
    renderGrid();
  });
});

function waLink(productName){
  const msg = "Bonjour, je suis intéressé(e) par le modèle : " + productName;
  return `https://wa.me/${activeNumber}?text=${encodeURIComponent(msg)}`;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const items = products.filter(p => p.categorie === currentCat);
  grid.innerHTML = '';
  if(items.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  items.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="imgbox"><img src="${p.image_url}" alt="${p.nom}"></div>
      <div class="info">
        <h3>${p.nom}</h3>
        <button class="order-btn">Commander sur WhatsApp</button>
      </div>`;
    card.querySelector('.order-btn').addEventListener('click', ()=>{
      window.open(waLink(p.nom), '_blank');
    });
    grid.appendChild(card);
  });
}

async function loadProducts(){
  const { data, error } = await sb.from('produits').select('*').order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  products = data || [];
}

async function loadSettings(){
  const { data, error } = await sb.from('parametres').select('*').eq('id', 1).single();
  if(!error && data && data.numero_whatsapp_actif){
    activeNumber = data.numero_whatsapp_actif;
  }
}

async function init(){
  await loadSettings();
  await loadProducts();
  renderGrid();
}

init();
</script>
