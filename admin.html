<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dwin Couture — Espace pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ivory:#F2EBDD;
    --card:#FBF8F1;
    --charcoal:#221E1A;
    --charcoal-soft:#3A342C;
    --gold:#A9823D;
    --gold-soft:#D9C9A3;
    --burgundy:#6E2A38;
    --muted:#7A7166;
    --line:#DCD1BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--charcoal);
    font-family:'Jost',sans-serif;
    font-weight:400;
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;}

  header{
    padding:36px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header img{
    width:150px;
    height:150px;
    object-fit:contain;
    display:block;
    margin:0 auto 6px;
  }
  header p.tagline{
    margin:0;
    font-size:15px;
    font-style:italic;
    color:var(--muted);
    font-family:'Cormorant Garamond',serif;
  }
  header p.contact-line{
    margin:4px 0 0;
    font-size:13px;
    color:var(--charcoal-soft);
    letter-spacing:0.01em;
  }

  .tabs{
    display:flex;
    justify-content:center;
    gap:0;
    margin:34px 0 28px;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    background:none;
    border:none;
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
    font-weight:600;
    color:var(--muted);
    padding:8px 26px 14px;
    cursor:pointer;
    position:relative;
    transition:color .25s ease;
  }
  .tab-btn.active{color:var(--charcoal);}
  .tab-btn.active::after{
    content:'';
    position:absolute;
    left:18%;right:18%;bottom:-1px;
    height:2px;
    background:var(--gold);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:18px;
    padding:0 0 60px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .card .imgbox{
    aspect-ratio:3/4;
    background:#EFE7D6;
    overflow:hidden;
  }
  .card .imgbox img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .card .info{
    padding:12px 14px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .card .info h3{
    margin:0;
    font-size:19px;
    font-weight:600;
  }
  .card .order-btn{
    margin-top:auto;
    background:var(--charcoal);
    color:var(--ivory);
    border:none;
    padding:10px 12px;
    font-family:'Jost',sans-serif;
    font-size:13px;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:background .2s ease;
  }
  .card .order-btn:hover{background:var(--burgundy);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'Cormorant Garamond',serif;
    font-size:19px;
    font-style:italic;
  }

  footer{
    text-align:center;
    padding:22px 20px 34px;
    color:var(--muted);
    font-size:12px;
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(34,30,26,0.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--ivory);
    border:1px solid var(--line);
    max-width:440px;
    width:100%;
    padding:28px 24px 30px;
    position:relative;
  }
  .modal h2{margin:0 0 4px;font-size:24px;}
  .modal .sub{font-size:13px;color:var(--muted);margin:0 0 20px;}
  .modal label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:14px 0 5px;
  }
  .modal input[type=text],
  .modal input[type=password],
  .modal select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Jost',sans-serif;
    font-size:14px;
  }
  .modal input[type=file]{
    width:100%;
    font-size:13px;
    margin-top:2px;
  }
  .modal .primary-btn{
    margin-top:20px;
    width:100%;
    background:var(--charcoal);
    color:var(--ivory);
    border:none;
    padding:11px;
    font-size:14px;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .modal .primary-btn:disabled{opacity:.5;cursor:default;}
  .modal .primary-btn:hover:not(:disabled){background:var(--burgundy);}
  .modal .close-x{
    position:absolute;top:14px;right:16px;
    background:none;border:none;font-size:20px;
    cursor:pointer;color:var(--muted);
    line-height:1;
  }
  .modal .error-msg{
    color:var(--burgundy);
    font-size:13px;
    margin-top:10px;
    display:none;
  }
  .radio-row{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .radio-row label{
    display:flex;align-items:center;gap:8px;
    font-size:14px;color:var(--charcoal);
    margin:0;
  }
  .divider{
    border:none;border-top:1px solid var(--line);
    margin:26px 0 18px;
  }
  .admin-list{
    display:flex;flex-direction:column;gap:8px;
    max-height:220px;overflow-y:auto;
    margin-top:10px;
  }
  .admin-list .row{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);
    padding:6px 8px;
    background:#fff;
    font-size:13px;
  }
  .admin-list .row img{
    width:36px;height:44px;object-fit:cover;
  }
  .admin-list .row .name{flex:1;}
  .admin-list .row .cat{color:var(--muted);font-size:11px;}
  .admin-list .row button{
    background:none;border:none;color:var(--burgundy);
    cursor:pointer;font-size:12px;
    text-decoration:underline;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;
    transform:translateX(-50%);
    background:var(--charcoal);color:var(--ivory);
    padding:10px 18px;font-size:13px;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    z-index:80;
  }
  .toast.show{opacity:1;}
  .admin-page-wrap{max-width:480px;margin:40px auto;padding:0 20px 60px;}
  .back-link{
    display:inline-block;margin-bottom:18px;font-size:13px;
    color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);
  }
</style>
</head>
<body>

<div class="admin-page-wrap">
  <a href="index.html" class="back-link">&larr; Retour au site</a>

  <div id="loginBox">
    <h2 class="serif" style="font-size:26px;">Espace pro</h2>
    <p class="sub" style="color:var(--muted);font-size:13px;">Réservé à Dwin Couture</p>
    <label for="pwInput">Mot de passe</label>
    <input type="password" id="pwInput" placeholder="••••••••">
    <p class="error-msg" id="loginError">Mot de passe incorrect.</p>
    <button class="primary-btn" id="loginBtn">Entrer</button>
  </div>

  <div id="panelBox" style="display:none;">
    <h2 class="serif" style="font-size:26px;">Gérer la boutique</h2>
    <p style="color:var(--muted);font-size:13px;">Ajoute un modèle, choisis le numéro WhatsApp actif.</p>

    <label>Numéro WhatsApp pour les commandes</label>
    <div class="radio-row">
      <label><input type="radio" name="waNumber" value="22899601819"> +228 99-60-18-19</label>
      <label><input type="radio" name="waNumber" value="22891721745"> +228 91-72-17-45</label>
    </div>

    <hr class="divider">

    <h2 style="font-size:19px;">Ajouter un modèle</h2>
    <label for="prodName">Nom du modèle</label>
    <input type="text" id="prodName" placeholder="Ex : Costume trois pièces">
    <label for="prodCat">Catégorie</label>
    <select id="prodCat">
      <option value="hommes">Hommes</option>
      <option value="femmes">Femmes</option>
      <option value="enfants">Enfants</option>
    </select>
    <label for="prodImg">Photo</label>
    <input type="file" id="prodImg" accept="image/*">
    <button class="primary-btn" id="addProdBtn">Ajouter à la boutique</button>

    <hr class="divider">

    <h2 style="font-size:19px;">Modèles en ligne</h2>
    <div class="admin-list" id="adminList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const SUPABASE_URL = "https://fhpmshyylqflgxxxomgx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IP4RR3zcXFFGK08qFsjPlw_cNg_Iwfp";
const BUCKET_NAME = "produit-image";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ADMIN_PASSWORD = "dwin2026";

let products = [];
let activeNumber = "22899601819";

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const val = document.getElementById('pwInput').value;
  if(val === ADMIN_PASSWORD){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panelBox').style.display = 'block';
    await loadSettings();
    await loadProducts();
    document.querySelectorAll('input[name=waNumber]').forEach(r=>{
      r.checked = (r.value === activeNumber);
    });
    renderAdminList();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
});
document.getElementById('pwInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.querySelectorAll('input[name=waNumber]').forEach(r=>{
  r.addEventListener('change', async ()=>{
    activeNumber = r.value;
    const { error } = await sb.from('parametres')
      .update({ numero_whatsapp_actif: activeNumber })
      .eq('id', 1);
    if(error){ console.error(error); showToast("Erreur d'enregistrement du numéro."); }
    else showToast('Numéro WhatsApp mis à jour.');
  });
});

document.getElementById('addProdBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('prodName').value.trim();
  const cat = document.getElementById('prodCat').value;
  const fileInput = document.getElementById('prodImg');
  const file = fileInput.files[0];
  const btn = document.getElementById('addProdBtn');

  if(!name || !file){
    showToast('Ajoute un nom et une photo.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  try{
    const ext = file.name.split('.').pop();
    const path = `${cat}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;

    const { error: uploadError } = await sb.storage
      .from(BUCKET_NAME)
      .upload(path, file);
    if(uploadError) throw uploadError;

    const { data: urlData } = sb.storage.from(BUCKET_NAME).getPublicUrl(path);
    const imageUrl = urlData.publicUrl;

    const { error: insertError } = await sb.from('produits')
      .insert({ nom: name, categorie: cat, image_url: imageUrl });
    if(insertError) throw insertError;

    showToast('Modèle ajouté.');
    document.getElementById('prodName').value = '';
    fileInput.value = '';
    await loadProducts();
    renderAdminList();
  }catch(err){
    console.error(err);
    showToast("Erreur : le modèle n'a pas pu être ajouté.");
  }finally{
    btn.disabled = false;
    btn.textContent = 'Ajouter à la boutique';
  }
});

async function deleteProduct(id){
  const { error } = await sb.from('produits').delete().eq('id', id);
  if(error){
    console.error(error);
    showToast('Erreur lors de la suppression.');
    return;
  }
  await loadProducts();
  renderAdminList();
  showToast('Modèle supprimé.');
}

function renderAdminList(){
  const list = document.getElementById('adminList');
  list.innerHTML = '';
  if(products.length === 0){
    list.innerHTML = '<p style="color:var(--muted);font-size:13px;">Aucun modèle pour le moment.</p>';
    return;
  }
  products.forEach(p=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<img src="${p.image_url}" alt=""><span class="name">${p.nom}<br><span class="cat">${p.categorie}</span></span><button data-id="${p.id}">Supprimer</button>`;
    row.querySelector('button').addEventListener('click', ()=> deleteProduct(p.id));
    list.appendChild(row);
  });
}

async function loadProducts(){
  const { data, error } = await sb.from('produits').select('*').order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  products = data || [];
}

async function loadSettings(){
  const { data, error } = await sb.from('parametres').select('*').eq('id', 1).single();
  if(!error && data && data.numero_whatsapp_actif){
    activeNumber = data.numero_whatsapp_actif;
  }
}
</script>
</body>
</html>
